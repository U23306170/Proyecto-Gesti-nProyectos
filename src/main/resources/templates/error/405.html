<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport"
        content="width=device-width, user-scalable=no, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.min.css" rel="stylesheet">
    <title>Error 405</title>
</head>

<body class="bg-white d-flex justify-content-center align-items-center vh-100">
    <div class="text-center">
        <div class="mb-3" style="font-size:5rem; color:#dc3545">
            <i class="bi bi-shield-x"></i>
        </div>
        <h1 class="display-1 fw-bold text-danger">405</h1>

        <h2>Método no permitido</h2>

        <p class="text-dark">
            Intentaste acceder a esta página de una forma que no está permitida
            (por ejemplo, escribiendo la URL directamente en el navegador).
        </p>

        <a th:href="@{/reservas}" class="btn btn-success mt-3">
            Volver a reservas
        </a>
    </div>
</body>

</html>
