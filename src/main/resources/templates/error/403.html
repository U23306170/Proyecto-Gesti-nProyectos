<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
      lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Acceso denegado</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.min.css" rel="stylesheet">
</head>
<body class="bg-light">

<nav class="navbar navbar-dark bg-dark">
  <div class="container d-flex justify-content-between align-items-center">
    <a class="navbar-brand fw-bold" th:href="@{/reservas}">
      <i class="bi bi-tree-fill me-2 text-success"></i>Hotel El Descanso Eterno
    </a>
    <div sec:authorize="isAuthenticated()"
         class="d-flex align-items-center gap-3">
            <span class="text-white-50 small">
                <i class="bi bi-person-circle me-1"></i>
                <span sec:authentication="name"></span>
                <span class="badge bg-warning text-dark ms-1"
                      sec:authorize="hasRole('ADMIN')">ADMIN</span>
                <span class="badge bg-secondary ms-1"
                      sec:authorize="!hasRole('ADMIN')">RECEPCIONISTA</span>
            </span>
      <form th:action="@{/logout}" method="post" class="mb-0">
        <button class="btn btn-outline-light btn-sm">
          <i class="bi bi-box-arrow-right me-1"></i>Salir
        </button>
      </form>
    </div>
  </div>
</nav>

<div class="container d-flex justify-content-center align-items-center"
     style="min-height: calc(100vh - 56px)">
  <div class="text-center py-5">

    <div class="mb-3" style="font-size:5rem; color:#dc3545">
      <i class="bi bi-shield-x"></i>
    </div>

    <h1 class="display-4 fw-bold text-danger">403</h1>
    <h3 class="mt-2">Acceso denegado</h3>

    <p class="text-muted mt-3 mb-1">
      El usuario <strong sec:authentication="name"></strong>
      no tiene permisos para realizar esta operación.
    </p>
    <p class="text-muted small">
      Solo los administradores pueden anular reservas.
    </p>

    <a th:href="@{/reservas}" class="btn btn-primary mt-3">
      <i class="bi bi-arrow-left me-2"></i>Volver a reservas
    </a>
  </div>
</div>

</body>
</html>
